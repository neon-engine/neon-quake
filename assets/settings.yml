# The settings of the game, on top of those the engine starts with. What the
# file holds is described in docs/settings.md of the engine.
#
# No menu of the engine is named: the game has its own, the one of the
# original, which escape opens.

version: 1

window:
  width: 1920
  height: 1080
  mode: borderless

# The game draws every frame it can unless the player says otherwise in its
# video settings, which are written to user://settings.yml, on top of this.
rendering:
  vsync: false

# The game is played with a gamepad or with keyboard and mouse, and shows the
# buttons of the one that was used last. Moving the mouse does not take the
# buttons of a gamepad away: a stick or a gyro may be bound to the mouse
# outside the game. A key does.
input:
  mouse_switches_device: false
