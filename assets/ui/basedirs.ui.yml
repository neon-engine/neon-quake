# The menu the game opens with when there is more than one copy of its data
# under assets/basedirs/ and none was chosen before: a button for each, in
# `basedirs`, which the extension makes, see start-screen.cpp. The one that
# is picked is remembered in user://basedir.yml.
#
# Everything is done with a controller as well: up and down move between
# the copies, the lower face button picks one.

ui: basedirs
version: 1

reference_size: [1920, 1080]
modal: true
cancel: none

root:
  type: panel
  width: 100%
  height: 100%
  justify_content: center
  align_items: center
  background_color: "#000000"
  children:
    - type: panel
      padding: 32
      gap: 16
      min_width: 480
      flex_direction: column
      align_items: stretch
      background_color: "#2a2018"
      border_radius: 8
      children:
        - type: label
          text: Which data of the game?
          font_size: 32
          font_weight: bold
          text_align: center
        - type: label
          text: Each is a folder under assets/basedirs/ with an id1 in it
          font_size: 16
          color: "#ffffffa0"
          text_align: center
          margin_bottom: 8
        - type: panel
          name: basedirs
          gap: 12
          flex_direction: column
          align_items: stretch
        - type: label
          hidden: "{gamepad}"
          text: "The arrows move, enter starts"
          font_size: 14
          color: "#ffffff80"
          text_align: center
          margin_top: 8
        - type: label
          hidden: "{!gamepad}"
          text: "The pad moves, A starts"
          font_size: 14
          color: "#ffffff80"
          text_align: center
          margin_top: 8
