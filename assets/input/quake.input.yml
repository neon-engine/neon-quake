# The input map of the game: what the player does, and what is bound to each.
# What the file holds is described in docs/input.md of the engine.
#
# The first five are what the player of the engine walks, looks, and jumps
# with. The rest is the game's own: the game code is told that `fire` is
# down, and gets the number of a weapon, or the wish for the next or the one
# before, as the player asks for it.
#
# Everything can be done with a controller: the sticks walk and look, the
# right trigger fires, the lower face button jumps, and the pad goes through
# the weapons with left and right. Up on the pad is the scores of the level,
# which the game does not show yet. Down on the pad is free.

version: 1

actions:
  move:
    type: axis2
    keys: [w, s, a, d]
    stick: left
  look:
    type: axis2
    mouse: motion
    stick: right
    rate: 600
  jump:
    type: button
    keys: [space]
    buttons: [south]
  run:
    type: button
    keys: [left-shift]
    buttons: [left-stick]
  pause:
    type: button
    keys: [escape]
    buttons: [start]
  fire:
    type: button
    mouse: left
    keys: [left-control]
    buttons: [right-trigger]
  weapon-next:
    type: button
    keys: [e]
    buttons: [dpad-right]
  weapon-previous:
    type: button
    keys: [q]
    buttons: [dpad-left]
  scores:
    type: button
    keys: [tab]
    buttons: [dpad-up]
  weapon-1:
    type: button
    keys: ["1"]
  weapon-2:
    type: button
    keys: ["2"]
  weapon-3:
    type: button
    keys: ["3"]
  weapon-4:
    type: button
    keys: ["4"]
  weapon-5:
    type: button
    keys: ["5"]
  weapon-6:
    type: button
    keys: ["6"]
  weapon-7:
    type: button
    keys: ["7"]
  weapon-8:
    type: button
    keys: ["8"]

states:
  playing: [move, look, jump, run, pause, fire, weapon-next, weapon-previous, scores, weapon-1, weapon-2, weapon-3, weapon-4, weapon-5, weapon-6, weapon-7, weapon-8]
  menu: [pause]
