# The input map of the game: what the player does, and what is bound to each.
# What the file holds is described in docs/input.md of the engine.
#
# The first five are what the player of the engine walks, looks, and jumps
# with. The rest is the game's own: the game code is told that `fire` is
# down, and gets the number of a weapon, or the wish for the next or the one
# before, as the player asks for it. The wheel of the mouse goes through the
# weapons as LibreQuake's own settings have it: up for the next, down for the
# one before, a notch a weapon.
#
# `run` is held to walk: the player runs otherwise, as the game is played
# today. `swim-up` and `swim-down` are for water; `jump` swims up as well.
#
# `pause` opens the menu of the game and goes back in it, escape or start.
# The `menu-` actions move in it: the arrows or the pad, enter or the lower
# face button to choose, backspace or the right face button to go back. With
# a Switch controller the game takes the two face buttons the other way
# around, so that A chooses and B goes back.
#
# Everything can be done with a controller: the sticks walk and look, the
# right trigger fires, the lower face button jumps, the shoulders swim up and
# down, and the pad goes through the weapons with left and right. Up on the pad is the scores of the level.
# Down on the pad is free.

version: 1

actions:
  move:
    type: axis2
    keys: [w, s, a, d]
    stick: left
  look:
    type: axis2
    mouse: motion
  # The stick looks apart from the mouse, so that each has a speed of its
  # own in the options. Pushed all the way it turns as a mouse moved this
  # many pixels in a second: about 210 degrees at the speed it starts with.
  look-stick:
    type: axis2
    stick: right
    rate: 3200
  jump:
    type: button
    keys: [space]
    buttons: [south]
  run:
    type: button
    keys: [left-shift]
    buttons: [left-stick]
  pause:
    type: button
    keys: [escape]
    buttons: [start]
  fire:
    type: button
    mouse: left
    keys: [left-control]
    buttons: [right-trigger]
  swim-up:
    type: button
    keys: [f]
    buttons: [right-shoulder]
  swim-down:
    type: button
    keys: [c]
    buttons: [left-shoulder]
  weapon-next:
    type: button
    keys: [e]
    mouse: wheel-up
    buttons: [dpad-right]
  weapon-previous:
    type: button
    keys: [q]
    mouse: wheel-down
    buttons: [dpad-left]
  scores:
    type: button
    keys: [tab]
    buttons: [dpad-up]
  menu-up:
    type: button
    keys: [up]
    buttons: [dpad-up]
  menu-down:
    type: button
    keys: [down]
    buttons: [dpad-down]
  menu-left:
    type: button
    keys: [left]
    buttons: [dpad-left]
  menu-right:
    type: button
    keys: [right]
    buttons: [dpad-right]
  menu-select:
    type: button
    keys: [enter]
    buttons: [south]
  menu-back:
    type: button
    keys: [backspace]
    buttons: [east]
  menu-yes:
    type: button
    keys: [y]
  menu-no:
    type: button
    keys: [n]
  weapon-1:
    type: button
    keys: ["1"]
  weapon-2:
    type: button
    keys: ["2"]
  weapon-3:
    type: button
    keys: ["3"]
  weapon-4:
    type: button
    keys: ["4"]
  weapon-5:
    type: button
    keys: ["5"]
  weapon-6:
    type: button
    keys: ["6"]
  weapon-7:
    type: button
    keys: ["7"]
  weapon-8:
    type: button
    keys: ["8"]

states:
  playing: [move, look, look-stick, jump, run, pause, fire, swim-up, swim-down, weapon-next, weapon-previous, scores, menu-up, menu-down, menu-left, menu-right, menu-select, menu-back, menu-yes, menu-no, weapon-1, weapon-2, weapon-3, weapon-4, weapon-5, weapon-6, weapon-7, weapon-8]
  menu: [pause]
