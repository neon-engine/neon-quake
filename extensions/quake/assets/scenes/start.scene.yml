# What the game starts in: the eyes of the player and nothing else. The
# extension shows a level around them when the world comes up, and moves them
# as the game code moves the player: the player is no body of the engine.
scene: start
version: 1

entities:
  # where the player looks from, turned left and right by the game
  - name: player
    components:
      Transform:
        position: [0, 2, 8]
    children:
      # turned up and down by the game
      - name: camera
        components:
          Transform: Default
          Camera: Default
          SoundListener: Default
