# What the game starts in: the eyes of the player and nothing else. The
# extension shows a level around them when the world comes up, and moves them
# as the game code moves the player: the player is no body of the engine.
scene: start
version: 1

entities:
  # where the player looks from, turned left and right by the game
  - name: player
    components:
      Transform:
        position: [0, 2, 8]
    children:
      # Turned up and down by the game. The game sees 90 degrees across a
      # screen of 4 by 3, which is 73.74 from top to bottom, and its levels
      # and the weapons in the player's hands are made for that: seen
      # narrower, a weapon is below the screen. What is nearer than a unit
      # of the game and a half is not drawn.
      - name: camera
        components:
          Transform: Default
          Camera:
            fov: 73.74
            near: 0.05
          SoundListener: Default
