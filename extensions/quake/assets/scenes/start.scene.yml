# What the game starts with until it reads a level of its own: a floor, a
# light, and a camera, so that there is something to see.
scene: start
version: 1

entities:
  - name: camera
    components:
      Transform:
        position: [0, 2, 8]
        rotation: [-10, 0, 0]
      Camera: Default

  - name: sun
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.3, -1, -0.2]
        ambient: [0.35, 0.35, 0.4]
        diffuse: [0.6, 0.6, 0.55]
        specular: [0.2, 0.2, 0.2]

  - name: floor
    components:
      Transform:
        position: [0, -0.5, 0]
        scale: [40, 1, 40]
      Renderable:
        model: assets://models/cube.obj
        fit: unit
        shader: assets://shaders/basic-lit
        material:
          shininess: 8
          color: [0.45, 0.4, 0.35]
